name: Update profile card

on:
  schedule:
    - cron: "0 4 * * *"   # every day, 04:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: [generate_card.py]

permissions:
  contents: write

jobs:
  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Draw the card
        run: python generate_card.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_LOGIN: ${{ github.repository_owner }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg stats.json
          git diff --cached --quiet || git commit -m "Update profile card"
          git push
